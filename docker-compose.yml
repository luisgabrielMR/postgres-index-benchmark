services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: index_benchmark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d index_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
